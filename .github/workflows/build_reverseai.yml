name: Build ReverseAI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK (version from gradle.properties)
        run: sdkmanager --install "ndk;$(grep '^ndkVersion=' gradle.properties | cut -d= -f2)"

      - name: Build APK (universal debug)
        run: |
          chmod +x gradlew
          export TERMUX_PACKAGE_VARIANT=apt-android-7
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reverseai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
